# Temporary origin containment. This file must be enabled in Apache.
# No cookie, Referer, User-Agent or query-string exemption.
# Protect the filesystem AND URL space; no file is deleted or moved.
<Directory "/var/www/html/wp-content/uploads">
    AllowOverride None
    Options -Indexes -MultiViews -FollowSymLinks -SymLinksIfOwnerMatch
    Require all denied
</Directory>
<DirectoryMatch "^/var/www/html/wp-content/themes/[^/]+/(?:content|assets/media)(?:/|$)">
    AllowOverride None
    Options -Indexes -MultiViews -FollowSymLinks -SymLinksIfOwnerMatch
    Require all denied
</DirectoryMatch>
# Cover legacy/copied media under any document-root path, including extra suffixes.
<Directory "/var/www/html">
    Options -Indexes -MultiViews
    <FilesMatch "(?i)\.(?:jpe?g|png|gif|webp|avif|svg|bmp|tiff?|ico|mp4|m4v|mov|webm|avi|mkv|m3u8|ts|mp3|m4a|wav|ogg)(?:[.;].*)?$">
        Require all denied
    </FilesMatch>
</Directory>
# These are additive URL safeguards; the filesystem protection above is essential.
<LocationMatch "(?i)(?:^|/)wp-content/uploads(?:/|$)">
    AuthMerging And
    Require all denied
    ErrorDocument 403 "Public media temporarily unavailable."
</LocationMatch>
<LocationMatch "(?i)(?:^|/)wp-content/themes/[^/]+/(?:content|assets/media)(?:/|$)">
    AuthMerging And
    Require all denied
    ErrorDocument 403 "Public content temporarily unavailable."
</LocationMatch>
# Fail build/startup if mod_headers is missing, rather than silently skipping.
Header always set X-PecadosVIP-Origin-Protection "closed-v1"
Header always set Cache-Control "private, no-store, max-age=0"
Header always set Referrer-Policy "no-referrer"
Header always set X-Content-Type-Options "nosniff"
